<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">
  <meta name="theme-color" content="#f4f7f9">
  <link rel="preload" href="main.dart.js" as="script">
  <link rel="preload" href="arzo-mark.png" as="image" type="image/png">
  <link rel="preconnect" href="https://maps.googleapis.com">
  <link rel="preconnect" href="https://maps.gstatic.com" crossorigin>

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="saladafactory">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>أرزو | نظام العمليات</title>
  <link rel="manifest" href="manifest.json">
  <script async src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDKIUgpxLNDclvZq2z0NpOujXIBsY3tFQo&loading=async"></script>
  <style>
    :root {
      --arzo-ground: #f4f7f9;
      --arzo-label: #15262d;
      --arzo-label-secondary: #52666f;
    }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--arzo-ground);
    }
    #app-loading {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: grid;
      place-items: center;
      background: var(--arzo-ground);
      color: var(--arzo-label);
      direction: rtl;
      font-family: system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif;
    }
    .arzo-brand {
      display: grid;
      justify-items: center;
      gap: 6px;
    }
    .arzo-mark {
      display: block;
      width: 58px;
      height: 58px;
      object-fit: contain;
    }
    .arzo-name {
      margin: 0;
      color: var(--arzo-label);
      font-size: 25px;
      font-weight: 800;
      line-height: 1;
    }
    .arzo-group {
      margin: 1px 0 0;
      color: var(--arzo-label-secondary);
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 3px;
    }
  </style>
</head>
<body>
  <div id="app-loading" role="status" aria-label="أرزو">
    <div class="arzo-brand">
      <img class="arzo-mark" src="arzo-mark.png" alt="" width="58" height="58">
      <p class="arzo-name">أرزو</p>
      <p class="arzo-group">ARZO GROUP</p>
    </div>
  </div>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
